<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="ZUSA account verification">
  <title>ZUSA | Verification Successful</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="verification-page" aria-labelledby="verification-message">

      <div class="check-circle" aria-label="Verification successful" role="img">
        <svg class="check-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M14 33.5 L27 46.5 L50 18.5" />

      </div>

      <p id="verification-message" class="verification-message">
        Successfully verified your account, you can go back to Discord.
      </p>
    </div>

    <footer class="rights">All Rights Reserved</footer>
  </main>
</body>
</html>
